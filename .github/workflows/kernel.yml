name: NoqeriOS kernel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qemu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        memory: [128M, 256M, 768M]
    steps:
      - name: Checkout NoqeriOS
        uses: actions/checkout@v4

      - name: Checkout Noqeri compiler
        uses: actions/checkout@v4
        with:
          repository: EMN90909/Noqeri
          path: .deps/Noqeri

      - name: Install kernel test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils xorriso qemu-system-x86 cmake g++ make git curl nasm autoconf automake libtool pkg-config mtools patch

      - name: Build Noqeri compiler
        run: |
          cmake -S .deps/Noqeri -B .deps/Noqeri/build -DCMAKE_BUILD_TYPE=Release -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DBUILD_TESTING=OFF
          cmake --build .deps/Noqeri/build --target noqeri --parallel 2

      - name: Verify kernel source and boot contracts
        run: |
          test -f Kernel/main.noqeri
          test -z "$(find Arch Drivers Kernel -type f -name '*.nqr' -print -quit)"
          bash -n build.sh Tests/qemu-smoke.sh Tests/bios-cpu-smoke.sh
          test -f Bootloader/native/stage0.S
          test -f Bootloader/native/stage1.S
          test -f Bootloader/handoff.noqeri
          test -f Bootloader/README.md
          grep -q -- '--unsafe' build.sh
          grep -q '0x36d76289' Arch/x86_64/entry.S

      - name: Assemble original BIOS bootloader
        run: |
          mkdir -p build/native-check
          as --32 Bootloader/native/stage0.S -o build/native-check/stage0.o
          ld -m elf_i386 -Ttext 0x7c00 --oformat binary -o build/native-check/stage0.bin build/native-check/stage0.o
          as --32 Bootloader/native/stage1.S -o build/native-check/stage1.o
          ld -m elf_i386 -Ttext 0x8000 --oformat binary -o build/native-check/stage1.bin build/native-check/stage1.o
          python3 -m py_compile Bootloader/native/image.py Tests/terminal-interaction.py Tests/gui-smoke.py
          python3 - <<'PY'
          from pathlib import Path
          s0 = Path('build/native-check/stage0.bin').read_bytes()
          s1 = Path('build/native-check/stage1.bin').read_bytes()
          assert len(s0) == 512 and s0[-2:] == bytes((0x55,0xaa))
          assert 0 < len(s1) <= 16384
          print('Custom BIOS loader assembly and signature OK')
          PY

      - name: Compile and boot NoqeriOS
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
          NOQERIOS_MEMORY: ${{ matrix.memory }}
        run: bash Tests/qemu-smoke.sh

      - name: Reject unsupported 32-bit-only BIOS CPUs
        if: matrix.memory == '256M'
        run: bash Tests/bios-cpu-smoke.sh

      - name: Boot VirtIO Ethernet and acquire IPv4 DHCP lease
        if: matrix.memory == '256M'
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
          NOQERIOS_NETWORK: '1'
          NOQERIOS_MEMORY: 256M
        run: bash Tests/qemu-smoke.sh

      - name: Boot Intel 82540EM Ethernet and acquire IPv4 DHCP lease
        if: matrix.memory == '256M'
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
          NOQERIOS_NETWORK: e1000
          NOQERIOS_MEMORY: 256M
        run: bash Tests/qemu-smoke.sh

      - name: Boot Realtek RTL8139 Ethernet and acquire IPv4 DHCP lease
        if: ${{ always() && matrix.memory == '256M' }}
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
          NOQERIOS_NETWORK: rtl8139
          NOQERIOS_MEMORY: 256M
        run: bash Tests/qemu-smoke.sh

      - name: Verify outbound TCP/HTTP on all three Ethernet adapters
        if: matrix.memory == '256M'
        run: |
          for nic in virtio e1000 rtl8139; do
            python3 Tests/tcp-http-smoke.py --nic "$nic"
          done

      - name: Verify interactive NoqeriOS terminal
        if: matrix.memory == '256M'
        run: python3 Tests/terminal-interaction.py --memory 256M

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noqerios-serial-log-${{ matrix.memory }}
          path: |
            build/qemu-serial.log
            build/qemu-boot-debug.log
          if-no-files-found: ignore

      - name: Upload BIOS ISO
        if: ${{ success() && matrix.memory == '256M' }}
        uses: actions/upload-artifact@v4
        with:
          name: noqerios-custom-bios-iso
          path: build/noqerios.iso
          if-no-files-found: error


  uefi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout NoqeriOS
        uses: actions/checkout@v4

      - name: Checkout Noqeri compiler
        uses: actions/checkout@v4
        with:
          repository: EMN90909/Noqeri
          path: .deps/Noqeri

      - name: Install UEFI and OVMF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake binutils xorriso mtools gnu-efi ovmf qemu-system-x86 python3

      - name: Build Noqeri compiler
        run: |
          cmake -S .deps/Noqeri -B .deps/Noqeri/build -DCMAKE_BUILD_TYPE=Release -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DBUILD_TESTING=OFF
          cmake --build .deps/Noqeri/build --target noqeri --parallel 2

      - name: Verify UEFI sources and shell scripts
        run: |
          bash -n build.sh Bootloader/uefi/build.sh Tests/uefi-smoke.sh
          test -f Arch/x86_64/entry.S
          grep -q 'uefi_kernel_entry' Arch/x86_64/entry.S
          test -f Bootloader/uefi/loader.c

      - name: Validate GPT removable-media image builder
        run: python3 -m unittest discover -s Tests -p 'test_uefi_usb.py'

      - name: Build UEFI ISO and boot under OVMF
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
        run: bash Tests/uefi-smoke.sh

      - name: Discover and chainload second UEFI bootloader
        run: python3 Tests/dualboot-uefi.py

      - name: Verify GOP framebuffer handoff under OVMF
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
          NOQERIOS_REQUIRE_GOP: '1'
        run: bash Tests/uefi-smoke.sh

      - name: Verify on-screen compositor and PS/2 keyboard focus
        run: python3 Tests/gui-smoke.py

      - name: Probe VirtIO GPU control queue under OVMF
        run: python3 Tests/gpu-smoke.py

      - name: Verify GPT UEFI USB image under OVMF
        env:
          NOQERI: ${{ github.workspace }}/.deps/Noqeri/build/noqeri
          NOQERIOS_UEFI_MEDIA: usb
        run: bash Tests/uefi-smoke.sh

      - name: Boot GPT UEFI media over emulated USB
        run: bash Tests/uefi-usb-smoke.sh

      - name: Upload UEFI boot debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noqerios-uefi-logs
          path: |
            build/uefi-boot-debug.log
            build/uefi-serial.log
            build/uefi-usb-debug.log
            build/uefi-usb-serial.log
          if-no-files-found: ignore

      - name: Upload verified hybrid ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noqerios-bios-uefi-iso-and-usb
          path: |
            build/noqerios.iso
            build/noqerios-uefi-usb.img
          if-no-files-found: error
